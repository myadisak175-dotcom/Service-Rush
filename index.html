<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6efe5" />
    <title>Service Rush</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #f6efe5; }
      body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #app { min-height: 100%; }
      #boot-screen {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f6efe5;
        color: #3b2c24;
        text-align: center;
      }
      .boot-card { display: grid; justify-items: center; gap: 14px; }
      .boot-mark { font-size: 44px; line-height: 1; }
      .boot-title { margin: 0; font-size: 30px; letter-spacing: .04em; }
      .boot-status { margin: 0; color: #745f53; font-size: 15px; }
      .boot-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(59, 44, 36, .16);
        border-top-color: #3b2c24;
        border-radius: 50%;
        animation: boot-spin .8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-spinner { animation: none; } }
    </style>
  </head>
  <body>
    <main id="app">
      <div id="boot-screen" role="status" aria-live="polite">
        <div class="boot-card">
          <div class="boot-mark" aria-hidden="true">🍜</div>
          <h1 class="boot-title">SERVICE RUSH</h1>
          <div class="boot-spinner" aria-hidden="true"></div>
          <p class="boot-status" id="boot-status">Opening restaurant…</p>
        </div>
      </div>
      <div id="game" aria-label="Service Rush game"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
